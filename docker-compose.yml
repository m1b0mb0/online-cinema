services:
  db:
    image: postgres:16-alpine
    container_name: postgres_cinema
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_cinema_data:/var/lib/postgresql/data/
    networks:
      - cinema_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_cinema
    ports:
      - "3333:80"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_cinema_data:/var/lib/pgadmin
    networks:
      - cinema_network

  web:
    restart: always
    build: .
    container_name: backend_cinema
    command: [ "/bin/bash", "/commands/run_web_server.sh" ]
    env_file:
      - .env
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/usr/src/fastapi
      - WATCHFILES_FORCE_POLLING=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/usr/src/fastapi
    networks:
      - cinema_network

  migrator:
    build: .
    container_name: alembic_migrator_cinema
    command: [ "/bin/bash", "/commands/run_migration.sh" ]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/usr/src/fastapi
    env_file:
      - .env
    environment:
      - PYTHONPATH=/usr/src
    networks:
      - cinema_network

  mailhog:
    restart: always
    build:
      context: .
      dockerfile: ./docker/mailhog/Dockerfile
    container_name: mailhog_cinema
    command: ["/bin/bash", "-c", "/commands/setup_mailhog_auth.sh && /go/bin/MailHog"]
    ports:
      - "8025:8025"
      - "1025:1025"
    env_file:
      - .env
    environment:
      MH_AUTH_FILE: /mailhog.auth
    networks:
      - cinema_network

  redis:
    image: redis:7-alpine
    container_name: redis_cinema
    ports:
      - "6379:6379"
    networks:
      - cinema_network

  celery_worker:
    build: .
    container_name: celery_worker_cinema
    command: ["/bin/bash", "-c", "celery -A src.celery_app.celery_app:celery_app worker --loglevel=info"]
    env_file:
      - .env
    environment:
      - PYTHONPATH=/usr/src/fastapi
    depends_on:
      - redis
      - db
    volumes:
      - .:/usr/src/fastapi
    networks:
      - cinema_network
  celery_beat:
    build: .
    container_name: celery_beat_cinema
    command: ["/bin/bash", "-c", "celery -A src.celery_app.celery_app:celery_app beat --loglevel=info"]
    env_file:
      - .env
    environment:
      - PYTHONPATH=/usr/src/fastapi
    depends_on:
      - redis
    volumes:
      - .:/usr/src/fastapi
    networks:
      - cinema_network

volumes:
  postgres_cinema_data:
    driver: local
  pgadmin_cinema_data:
    driver: local

networks:
  cinema_network:
    driver: bridge